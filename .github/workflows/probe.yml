name: probe
on: [workflow_dispatch]
jobs:
  verde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        env:
          PROBE_JOB_STATUS: ${{ job.status }}
        with:
          status: ${{ job.status }}
      - run: echo "pas care reuseste"
  rosu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        env:
          PROBE_JOB_STATUS: ${{ job.status }}
        with:
          status: ${{ job.status }}
      - run: exit 1
