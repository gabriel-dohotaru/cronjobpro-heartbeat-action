# This repository watches itself with its own action.
#
# It doubles as the demo: open any run and you can see the start ping, the
# finish ping, and what the post step reports when the job fails on purpose.
name: heartbeat
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fail_on_purpose:
        description: 'Fail the job deliberately, to watch the failure get reported'
        type: boolean
        default: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `if:` cannot see env set on that
    # same step, so the skip would never trigger and forks would fail here.
    env:
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Report this run to the monitor
        if: env.HEARTBEAT_URL != ''
        uses: ./
        with:
          url: ${{ env.HEARTBEAT_URL }}
          status: ${{ job.status }}

      - name: The work this workflow actually exists to do
        run: node --test test/*.test.mjs

      - name: Fail on purpose
        if: ${{ inputs.fail_on_purpose }}
        run: |
          echo "Failing deliberately. The post step should report this as a failure."
          exit 1
