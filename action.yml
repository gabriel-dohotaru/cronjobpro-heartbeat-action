name: 'Scheduled Run Heartbeat'
description: 'GitHub tells you a scheduled run failed. It cannot tell you a run never happened. This does.'
author: 'CronJobPro'
branding:
  icon: 'activity'
  color: 'green'

inputs:
  url:
    description: 'Full ping URL. Works with any heartbeat service (CronJobPro, Healthchecks, and anything else using the same contract). Use this or `token`.'
    required: false
  token:
    description: 'CronJobPro heartbeat token, if you would rather not paste a whole URL. Ignored when `url` is set.'
    required: false
  server:
    description: 'Base URL of the service, when using `token`.'
    required: false
    default: 'https://api.cronjobpro.com'
  status:
    description: 'Pass `${{ job.status }}` so failures are reported. Without it, every run reports success.'
    required: false
  ping-start:
    description: 'Also signal when the run starts, which is what makes duration and overrun visible.'
    required: false
    default: 'true'
  timeout-ms:
    description: 'How long to wait for the heartbeat endpoint.'
    required: false
    default: '10000'
  retries:
    description: 'Retries per ping, with backoff.'
    required: false
    default: '2'

runs:
  using: 'node20'
  main: 'src/main.js'
  post: 'src/post.js'
